<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Lens</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--ink2:#475569;--line:#E2E8F0;--ind:#4F46E5;--pos:#10B981;--neu:#F59E0B;--neg:#EF4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#131C31;--ink:#F1F5F9;--ink2:#94A3B8;--line:#24304A;--ind:#818CF8}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C31;--ink:#F1F5F9;--ink2:#94A3B8;--line:#24304A;--ind:#818CF8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif}
.display{font-family:"Sora","DM Sans",system-ui,sans-serif}

#splash{position:fixed;inset:0;z-index:50;background:#0B1220;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
#splash::before{content:"";position:absolute;width:420px;height:420px;max-width:90vw;max-height:90vw;border-radius:50%;background:radial-gradient(circle,rgba(79,70,229,.35),transparent 65%);animation:glow 3s ease-in-out both}
.mark{position:relative;width:min(46vw,190px);height:auto;overflow:visible}
.ring{stroke-dasharray:240;stroke-dashoffset:0;animation:draw .9s cubic-bezier(.6,0,.2,1) .2s backwards}
.handle{stroke-dasharray:40;stroke-dashoffset:0;animation:drawh .4s ease-out .95s backwards}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .5s cubic-bezier(.3,1.4,.5,1) backwards}
.b1{animation-delay:1.1s}.b2{animation-delay:1.25s}.b3{animation-delay:1.4s}
.spark{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) 1.75s backwards}
.word{position:relative;margin:0;font-size:clamp(30px,9vw,42px);font-weight:600;letter-spacing:-.02em;color:#F1F5F9;animation:rise .7s ease-out 1.6s backwards}
.word span{color:#818CF8}
.tag{position:relative;margin:-8px 0 0;font-size:15px;color:#94A3B8;animation:rise .7s ease-out 1.9s backwards}
.load{position:absolute;bottom:calc(48px + env(safe-area-inset-bottom,0px));width:120px;height:3px;border-radius:2px;background:#1E293B;overflow:hidden}
.load i{display:block;height:100%;background:linear-gradient(90deg,#10B981,#F59E0B,#EF4444);animation:fill 3s linear infinite}
@keyframes draw{from{stroke-dashoffset:240}}
@keyframes drawh{from{stroke-dashoffset:40}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes pop{from{transform:scale(0) rotate(-90deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes glow{from{opacity:0;transform:scale(.6)}}
@keyframes fill{from{width:0}}
.load i{width:100%}

@media (prefers-reduced-motion:reduce){#splash *,#splash::before{animation:none!important}#splash{transition:opacity .2s}}
</style>
</head>
<body>

<div id="splash" role="status" aria-label="Review Lens is loading">
  <svg class="mark" viewBox="0 0 160 160" aria-hidden="true">
    <circle class="ring" cx="70" cy="70" r="38" fill="#141B34" stroke="#818CF8" stroke-width="8" stroke-linecap="round" transform="rotate(-90 70 70)"/>
    <line class="handle" x1="98" y1="98" x2="126" y2="126" stroke="#818CF8" stroke-width="10" stroke-linecap="round"/>
    <rect class="bar b1" x="52" y="74" width="12" height="16" rx="3" fill="#EF4444"/>
    <rect class="bar b2" x="67" y="62" width="12" height="28" rx="3" fill="#F59E0B"/>
    <rect class="bar b3" x="82" y="46" width="12" height="44" rx="3" fill="#10B981"/>
    <path class="spark" d="M110 18 L113.5 26.5 L122 30 L113.5 33.5 L110 42 L106.5 33.5 L98 30 L106.5 26.5 Z" fill="#A5B4FC"/>
  </svg>
  <h2 class="word display">Review <span>Lens</span></h2>
  <p class="tag">AI feedback analyser</p>
  <div class="load"><i></i></div>
</div>

</body>
</html>
